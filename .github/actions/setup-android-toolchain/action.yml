name: Setup Android build toolchain
description: >
  Installs the JDK, Android SDK platform tools, the canary compile SDK
  platform this project targets, and Gradle with its cache. Centralizes
  the toolchain bootstrap shared by every Android workflow so it only
  needs to be fixed in one place.

inputs:
  android-packages:
    description: Packages passed to android-actions/setup-android.
    required: false
    default: platform-tools
  cache-read-only:
    description: Whether the Gradle cache should be read-only for this job.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'

    - uses: android-actions/setup-android@v4
      with:
        packages: ${{ inputs.android-packages }}

    - name: Install Android 17 compile SDK
      shell: bash
      run: |
        curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
        export PATH="$HOME/.local/bin:$PATH"
        android --sdk="$ANDROID_SDK_ROOT" sdk install --canary platforms/android-37

    - uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ inputs.cache-read-only }}

name: Discord Notifications

on:
  workflow_dispatch:
    inputs:
      target:
        description: Discord webhook to test
        type: choice
        required: true
        default: github-activity
        options:
          - github-activity
          - beta-release
          - stable-release
      send_test:
        description: Send a TEST message to the selected Discord channel
        type: boolean
        required: true
        default: false
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  github-activity:
    if: github.event_name == 'issues' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Post GitHub activity to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_GITHUB_WEBHOOK }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_JSON: ${{ toJSON(github.event) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ.get("DISCORD_WEBHOOK", "")
          if not webhook:
              raise SystemExit("DISCORD_GITHUB_WEBHOOK is not configured")

          event = json.loads(os.environ["EVENT_JSON"])
          event_name = os.environ["EVENT_NAME"]
          action = os.environ["EVENT_ACTION"]

          if event_name == "issues":
              item = event["issue"]
              title = f"Issue #{item['number']} {action}: {item['title']}"
              description = f"Opened by **{item['user']['login']}**"
              labels = [label["name"] for label in item.get("labels", [])]
              if labels:
                  description += "\nLabels: " + ", ".join(f"`{x}`" for x in labels)
              color = 0xD29922
          else:
              item = event["pull_request"]
              merged = action == "closed" and bool(item.get("merged"))
              if action == "closed" and not merged:
                  # Do not announce ordinary closed/unmerged PRs.
                  raise SystemExit(0)
              state = "merged" if merged else action.replace("_", " ")
              title = f"PR #{item['number']} {state}: {item['title']}"
              description = (
                  f"By **{item['user']['login']}**\n"
                  f"`{item['head']['ref']}` → `{item['base']['ref']}`"
              )
              color = 0x8250DF if merged else 0x2F81F7

          payload = {
              "username": "Actua GitHub",
              "allowed_mentions": {"parse": []},
              "embeds": [{
                  "title": title[:256],
                  "url": item["html_url"],
                  "description": description[:4096],
                  "color": color,
                  "footer": {"text": "azimul-kabir/actua"}
              }]
          }

          req = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json", "User-Agent": "Actua-GitHub-Actions"},
              method="POST",
          )
          with urllib.request.urlopen(req) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(f"Discord returned HTTP {response.status}")
          PY

  release-notification:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Post release and changelog to Discord
        env:
          RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          BETA_WEBHOOK: ${{ secrets.DISCORD_BETA_WEBHOOK }}
          EVENT_JSON: ${{ toJSON(github.event) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          event = json.loads(os.environ["EVENT_JSON"])
          release = event["release"]
          prerelease = bool(release.get("prerelease"))
          webhook = os.environ.get("BETA_WEBHOOK" if prerelease else "RELEASE_WEBHOOK", "")
          if not webhook:
              name = "DISCORD_BETA_WEBHOOK" if prerelease else "DISCORD_RELEASE_WEBHOOK"
              raise SystemExit(f"{name} is not configured")

          version = release.get("tag_name") or release.get("name") or "New release"
          heading = "Actua beta released" if prerelease else "Actua released"
          body = (release.get("body") or "No release notes provided.").strip()

          # Discord embed descriptions are limited to 4096 characters. Preserve
          # the beginning of the changelog and link to GitHub for the complete notes.
          max_body = 3800
          if len(body) > max_body:
              body = body[:max_body].rstrip() + "\n\n… Full changelog on GitHub."

          assets = release.get("assets", [])
          apk = next((a for a in assets if a.get("name", "").lower().endswith(".apk")), None)
          links = f"[View release]({release['html_url']})"
          if apk:
              links += f" • [Download APK]({apk['browser_download_url']})"

          warning = "\n\n⚠️ **Beta software:** Back up your Actual Budget data before testing an important budget." if prerelease else ""
          description = f"{body}{warning}\n\n{links}"

          payload = {
              "username": "Actua Releases",
              "allowed_mentions": {"parse": []},
              "embeds": [{
                  "title": f"{heading}: {version}"[:256],
                  "url": release["html_url"],
                  "description": description[:4096],
                  "color": 0xD29922 if prerelease else 0x238636,
                  "footer": {"text": "Actua • Native Android client for Actual Budget"}
              }]
          }

          req = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json", "User-Agent": "Actua-GitHub-Actions"},
              method="POST",
          )
          with urllib.request.urlopen(req) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(f"Discord returned HTTP {response.status}")
          PY

  manual-test:
    name: Test Discord webhook
    if: github.event_name == 'workflow_dispatch' && inputs.send_test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send labeled TEST message
        env:
          TEST_TARGET: ${{ inputs.target }}
          DISCORD_WEBHOOK: ${{ inputs.target == 'github-activity' && secrets.DISCORD_GITHUB_WEBHOOK || inputs.target == 'beta-release' && secrets.DISCORD_BETA_WEBHOOK || inputs.target == 'stable-release' && secrets.DISCORD_RELEASE_WEBHOOK || '' }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          targets = {
              "github-activity": ("DISCORD_GITHUB_WEBHOOK", "Actua GitHub", 0x2F81F7),
              "beta-release": ("DISCORD_BETA_WEBHOOK", "Actua Releases", 0xD29922),
              "stable-release": ("DISCORD_RELEASE_WEBHOOK", "Actua Releases", 0x238636),
          }
          target = os.environ["TEST_TARGET"]
          if target not in targets:
              raise SystemExit("Invalid test target; no message sent")
          secret_name, username, color = targets[target]
          webhook = os.environ.get("DISCORD_WEBHOOK", "")
          if not webhook:
              raise SystemExit(f"{secret_name} is not configured; no message sent")

          run_url = (
              f"{os.environ['SERVER_URL']}/{os.environ['REPOSITORY']}"
              f"/actions/runs/{os.environ['RUN_ID']}"
          )
          payload = {
              "username": username,
              "allowed_mentions": {"parse": []},
              "embeds": [{
                  "title": f"TEST — Actua {target} webhook",
                  "description": (
                      "**TEST ONLY — manual webhook connectivity check.**\n"
                      "This is not an issue, pull request, merge, or release announcement. "
                      "No GitHub issue, pull request, or release was created.\n\n"
                      f"[View test run]({run_url})"
                  ),
                  "url": run_url,
                  "color": color,
                  "footer": {"text": "Actua • TEST notification"}
              }]
          }
          req = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json", "User-Agent": "Actua-GitHub-Actions"},
              method="POST",
          )
          # Do not print the webhook URL or Discord response body on failure.
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  if response.status not in (200, 204):
                      raise SystemExit(f"Discord returned HTTP {response.status}")
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Discord returned HTTP {error.code}") from None
          except (urllib.error.URLError, TimeoutError):
              raise SystemExit("Could not reach Discord; check the selected webhook and retry") from None
          print(f"TEST message sent successfully to {target}")
          PY

name: Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/build.gradle.kts
      - CHANGELOG.md
      - docs/releases/**
      - .github/workflows/android-release.yml

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
      - name: Install Android 17 compile SDK
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          export PATH="$HOME/.local/bin:$PATH"
          android --sdk="$ANDROID_SDK_ROOT" sdk install --canary platforms/android-37
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare persistent release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ACTUA_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ACTUA_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ACTUA_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ACTUA_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/actua-release.jks"
          chmod 600 "$RUNNER_TEMP/actua-release.jks"
      - name: Build, test and lint
        env:
          ACTUA_KEYSTORE_PATH: ${{ runner.temp }}/actua-release.jks
          ACTUA_KEYSTORE_PASSWORD: ${{ secrets.ACTUA_RELEASE_STORE_PASSWORD }}
          ACTUA_KEY_ALIAS: ${{ secrets.ACTUA_RELEASE_KEY_ALIAS }}
          ACTUA_KEY_PASSWORD: ${{ secrets.ACTUA_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease testInstrumentedUnitTest lintDebug
      - name: Verify release signature
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Read release version
        id: version
        run: echo "name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Prepare release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
        run: |
          VERSIONED_NOTES="docs/releases/${RELEASE_VERSION}.md"
          if [ -s "$VERSIONED_NOTES" ]; then
            cp "$VERSIONED_NOTES" release-notes.md
          else
            awk -v version="$RELEASE_VERSION" '
              $0 ~ "^## \\[" version "\\]" { found = 1; next }
              found && $0 ~ "^## \\[" { exit }
              found { print }
            ' CHANGELOG.md > release-notes.md
            if [ ! -s release-notes.md ]; then
              awk '
                $0 == "## Unreleased" { found = 1; next }
                found && $0 ~ "^## \\[" { exit }
                found { print }
              ' CHANGELOG.md > release-notes.md
            fi
          fi
          test -s release-notes.md
      - name: Prepare testing APK
        run: cp app/build/outputs/apk/release/app-release.apk "Actua-v${{ steps.version.outputs.name }}.apk"
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: v${{ steps.version.outputs.name }}
          name: Actua ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: Actua-v${{ steps.version.outputs.name }}.apk

name: Android Release

on:
  workflow_dispatch:
    inputs:
      publish_to_play:
        description: Upload a stable release to Google Play (turn off to re-run a release Play already has)
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - app/build.gradle.kts
      - CHANGELOG.md
      - docs/releases/**
      - .github/workflows/android-release.yml

permissions:
  contents: write

jobs:
  check-version-bump:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        # CHANGELOG.md and docs/releases/** are also touched by ordinary PRs appending to the
        # Unreleased section, not just release-prep PRs. Only a real versionCode bump means a
        # release should actually be built and published.
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous="$(git show "$before:app/build.gradle.kts" 2>/dev/null | grep -E 'versionCode = ' || true)"
          current="$(grep -E 'versionCode = ' app/build.gradle.kts)"
          if [ "$previous" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build-release:
    needs: [check-version-bump]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.check-version-bump.outputs.changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: ./.github/actions/setup-android-toolchain
      - name: Prepare persistent release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ACTUA_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ACTUA_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ACTUA_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ACTUA_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/actua-release.jks"
          chmod 600 "$RUNNER_TEMP/actua-release.jks"
      - name: Build, test and lint
        env:
          ACTUA_KEYSTORE_PATH: ${{ runner.temp }}/actua-release.jks
          ACTUA_KEYSTORE_PASSWORD: ${{ secrets.ACTUA_RELEASE_STORE_PASSWORD }}
          ACTUA_KEY_ALIAS: ${{ secrets.ACTUA_RELEASE_KEY_ALIAS }}
          ACTUA_KEY_PASSWORD: ${{ secrets.ACTUA_RELEASE_KEY_PASSWORD }}
        # The "fdroid" flavor excludes Play Billing, so it's the flavor published to GitHub
        # Releases and built by F-Droid; testInstrumentedUnitTest/lintDebug still aggregate
        # across both flavors.
        run: ./gradlew --no-daemon assembleFdroidRelease testInstrumentedUnitTest lintDebug
      - name: Verify release signature
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose --print-certs app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
      - name: Build release bundle for Play Console upload
        env:
          ACTUA_KEYSTORE_PATH: ${{ runner.temp }}/actua-release.jks
          ACTUA_KEYSTORE_PASSWORD: ${{ secrets.ACTUA_RELEASE_STORE_PASSWORD }}
          ACTUA_KEY_ALIAS: ${{ secrets.ACTUA_RELEASE_KEY_ALIAS }}
          ACTUA_KEY_PASSWORD: ${{ secrets.ACTUA_RELEASE_KEY_PASSWORD }}
        # The "playstore" flavor is the one that includes Play Billing (for Support Actua).
        run: ./gradlew --no-daemon bundlePlaystoreRelease
      - name: Read release version
        id: version
        run: |
          echo "name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Determine release channel
        id: channel
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
        # A version with a -beta./-alpha./-rc. suffix is a testing build and stays a GitHub
        # pre-release; a plain X.Y.Z is stable and should become the repo's Latest release
        # without manual editing.
        run: |
          if [[ "$RELEASE_VERSION" =~ -(beta|alpha|rc)\. ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      # Stable releases go to Google Play's production track before anything is published or
      # announced, so a failed upload stops the release instead of leaving Play behind GitHub.
      - name: Prepare Google Play release notes
        id: play
        if: steps.channel.outputs.prerelease == 'false' && (github.event_name == 'push' || inputs.publish_to_play)
        env:
          HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          if [ "$HAS_PLAY_KEY" != "true" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not configured; re-run manually with Google Play upload turned off to skip it"
            exit 1
          fi
          NOTES="fastlane/metadata/android/en-US/changelogs/${RELEASE_VERSION_CODE}.txt"
          if [ ! -s "$NOTES" ]; then
            echo "::error::$NOTES is missing; add the release's Google Play \"What's new\" text"
            exit 1
          fi
          python3 -c 'import sys; n = len(open(sys.argv[1], encoding="utf-8").read().strip()); sys.exit(f"{sys.argv[1]} has {n} characters; Google Play allows 500" if n > 500 else 0)' "$NOTES"
          mkdir -p "$RUNNER_TEMP/whatsnew"
          cp "$NOTES" "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Upload to Google Play production
        if: steps.play.outputs.published == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.azimulkabir.actua
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ steps.version.outputs.code }} (${{ steps.version.outputs.name }})
          track: production
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
      - name: Update F-Droid submission template
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.code }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          version_name = os.environ["RELEASE_VERSION"]
          version_code = os.environ["RELEASE_VERSION_CODE"]
          commit_sha = os.environ["RELEASE_COMMIT_SHA"]
          path = "fdroid/com.azimulkabir.actua.yml"

          with open(path) as f:
              content = f.read()

          def sub_required(pattern, repl, content, description):
              content, count = re.subn(pattern, repl, content, flags=re.MULTILINE)
              if count == 0:
                  sys.exit(f"F-Droid template update failed: no match for {description} in {path}")
              return content

          # F-Droid requires a pinned commit SHA in the build recipe, not a tag or branch.
          content = sub_required(
              r"^(# Actua ).*( is built from source at the release commit pinned below\.)$",
              rf"\g<1>{version_name}\g<2>",
              content,
              "header comment",
          )
          content = sub_required(r"^(\s*- versionName: ).*$", rf"\g<1>{version_name}", content, "Builds versionName")
          content = sub_required(r"^(\s*versionCode: ).*$", rf"\g<1>{version_code}", content, "Builds versionCode")
          content = sub_required(r"^(\s*commit: ).*$", rf"\g<1>{commit_sha}", content, "Builds commit")
          content = sub_required(r"^(CurrentVersion: ).*$", rf"\g<1>{version_name}", content, "CurrentVersion")
          content = sub_required(r"^(CurrentVersionCode: ).*$", rf"\g<1>{version_code}", content, "CurrentVersionCode")

          # These fields don't change per release, but they were added by hand
          # directly in the fdroiddata merge request in response to reviewer
          # comments and only backported here afterward. Nothing else in this
          # script keeps them in sync, so fail loudly if one goes missing
          # (e.g. a template edit accidentally drops it) instead of silently
          # publishing an incomplete submission template.
          required_inline_fields = [
              "License", "AuthorName", "AuthorWebSite", "SourceCode", "IssueTracker",
              "RepoType", "Repo", "Binaries", "AllowedAPKSigningKeys",
              "AutoUpdateMode", "UpdateCheckMode",
          ]
          for field in required_inline_fields:
              if not re.search(rf"^{field}:\s*\S", content, re.MULTILINE):
                  sys.exit(f"F-Droid template is missing required field '{field}' in {path}")

          if not re.search(r"^Categories:\s*\n\s*-\s*\S", content, re.MULTILINE):
              sys.exit(f"F-Droid template is missing a Categories entry in {path}")

          with open(path, "w") as f:
              f.write(content)
          PY
      - name: Commit F-Droid submission template update
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
        run: |
          if git diff --quiet -- fdroid/com.azimulkabir.actua.yml; then
            echo "No F-Droid template changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fdroid/com.azimulkabir.actua.yml
          git commit -m "Update F-Droid submission template for v${RELEASE_VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Prepare release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
        run: |
          VERSIONED_NOTES="docs/releases/${RELEASE_VERSION}.md"
          if [ -s "$VERSIONED_NOTES" ]; then
            cp "$VERSIONED_NOTES" release-notes.md
          else
            awk -v version="$RELEASE_VERSION" '
              $0 ~ "^## \\[" version "\\]" { found = 1; next }
              found && $0 ~ "^## \\[" { exit }
              found { print }
            ' CHANGELOG.md > release-notes.md
            if [ ! -s release-notes.md ]; then
              awk '
                $0 == "## Unreleased" { found = 1; next }
                found && $0 ~ "^## \\[" { exit }
                found { print }
              ' CHANGELOG.md > release-notes.md
            fi
          fi
          test -s release-notes.md
      - name: Prepare testing APK
        run: cp app/build/outputs/apk/fdroid/release/app-fdroid-release.apk "Actua-v${{ steps.version.outputs.name }}.apk"
      - name: Upload Play Store bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: Actua-v${{ steps.version.outputs.name }}-aab
          path: app/build/outputs/bundle/playstoreRelease/app-playstore-release.aab
          retention-days: 90
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.channel.outputs.prerelease }}
          make_latest: ${{ steps.channel.outputs.prerelease == 'false' }}
          tag_name: v${{ steps.version.outputs.name }}
          name: Actua ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: Actua-v${{ steps.version.outputs.name }}.apk
      - name: Notify Discord about release
        env:
          RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          BETA_WEBHOOK: ${{ secrets.DISCORD_BETA_WEBHOOK }}
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
          IS_PRERELEASE: ${{ steps.channel.outputs.prerelease }}
          # Every stable release is uploaded to Google Play (a manual re-run may skip a repeat upload).
          ON_PLAY: ${{ steps.channel.outputs.prerelease == 'false' }}
          BETA_ROLE_ID: ${{ vars.DISCORD_BETA_ROLE_ID }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          is_prerelease = os.environ["IS_PRERELEASE"] == "true"
          secret_name = "DISCORD_BETA_WEBHOOK" if is_prerelease else "DISCORD_RELEASE_WEBHOOK"
          # Stable releases go to the release channel; pre-releases to the beta channel.
          webhook = os.environ.get("BETA_WEBHOOK" if is_prerelease else "RELEASE_WEBHOOK", "")
          if not webhook:
              raise SystemExit(f"{secret_name} is not configured")

          # Pre-releases ping the opt-in beta-tester role when its ID is configured.
          beta_role_id = os.environ.get("BETA_ROLE_ID", "").strip() if is_prerelease else ""
          if beta_role_id and not (beta_role_id.isascii() and beta_role_id.isdigit()):
              raise SystemExit("DISCORD_BETA_ROLE_ID must be a numeric Discord role ID")

          version = os.environ["RELEASE_VERSION"]
          repo = os.environ["REPOSITORY"]
          server = os.environ["SERVER_URL"]
          tag = f"v{version}"
          release_url = f"{server}/{repo}/releases/tag/{tag}"
          apk_url = f"{server}/{repo}/releases/download/{tag}/Actua-v{version}.apk"
          play_url = "https://play.google.com/store/apps/details?id=com.azimulkabir.actua"
          on_play = os.environ.get("ON_PLAY") == "true"

          with open("release-notes.md", encoding="utf-8") as f:
              body = f.read().strip()
          if not body:
              body = "No release notes provided."

          # Leave room for the safety notice and release/download links.
          max_body = 3500
          if len(body) > max_body:
              body = body[:max_body].rstrip() + "\n\n… Full changelog on GitHub."

          safety_notice = (
              "⚠️ **Beta software:** Back up your Actual Budget data before testing an important budget."
              if is_prerelease
              else "Back up your Actual Budget data before updating an important budget."
          )
          # Lead with Google Play so people stay on the Play build; it was uploaded above but
          # reaches users only after Google's review.
          links = (
              f"**[Update on Google Play]({play_url})** (rolling out, usually within a day) • "
              f"[View release]({release_url}) • [Download APK]({apk_url})"
              if on_play
              else f"[View release]({release_url}) • [Download APK]({apk_url})"
          )
          description = (
              f"{body}\n\n"
              f"{safety_notice}\n\n"
              f"{links}"
          )
          title_verb = "beta released" if is_prerelease else "released"
          payload = {
              "username": "Actua Releases",
              "allowed_mentions": {"parse": []},
              "embeds": [{
                  "title": f"Actua {title_verb}: {tag}"[:256],
                  "url": release_url,
                  "description": description[:4096],
                  "color": 0xD29922 if is_prerelease else 0x238636,
                  "footer": {"text": "Actua • Native Android client for Actual Budget"}
              }]
          }
          if beta_role_id:
              payload["content"] = f"<@&{beta_role_id}>"
              payload["allowed_mentions"]["roles"] = [beta_role_id]
          req = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json", "User-Agent": "Actua-GitHub-Actions"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  if response.status not in (200, 204):
                      raise SystemExit(f"Discord returned HTTP {response.status}")
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Discord returned HTTP {error.code}") from None
          except (urllib.error.URLError, TimeoutError):
              raise SystemExit(f"Could not reach Discord via {secret_name}") from None
          print(f"Discord release notification sent for {tag}")
          PY
      # Both sites refresh their release info hourly, but GitHub often delays scheduled runs; this
      # updates them right away. A failure here never fails the release.
      - name: Notify the Actua website and developer site
        if: steps.channel.outputs.prerelease == 'false'
        continue-on-error: true
        env:
          SITES_DISPATCH_TOKEN: ${{ secrets.SITES_DISPATCH_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
        run: |
          if [ -z "$SITES_DISPATCH_TOKEN" ]; then
            echo "::warning::SITES_DISPATCH_TOKEN is not configured; the sites will update on their hourly schedule"
            exit 0
          fi
          for repo in azimul-kabir/actua-website azimul-kabir/azimul-kabir.github.io; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $SITES_DISPATCH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$repo/dispatches" \
              -d "{\"event_type\":\"app-released\",\"client_payload\":{\"version\":\"$RELEASE_VERSION\"}}")
            if [ "$status" = "204" ]; then
              echo "Notified $repo"
            else
              echo "::warning::Could not notify $repo (HTTP $status); it will update on its hourly schedule"
            fi
          done

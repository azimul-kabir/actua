name: F-Droid Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ci/fdroid-verify
    paths:
      - fdroid/**
      - app/build.gradle.kts
      - .github/workflows/fdroid-verify.yml

permissions:
  contents: read

jobs:
  verify-fdroid-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install F-Droid tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install fdroidserver

      - name: Read release version
        id: version
        run: echo "name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Download published APK
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          APK="Actua-v${VERSION}.apk"
          curl --fail --location --retry 3 \
            "https://github.com/azimul-kabir/actua/releases/download/v${VERSION}/${APK}" \
            --output "$APK"
          test -s "$APK"
          sha256sum "$APK"

      - name: Scan published APK with F-Droid
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: fdroid scanner --exit-code "Actua-v${VERSION}.apk"

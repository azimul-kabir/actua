name: Android Compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: android-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select-coverage:
    name: Select compatibility coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_compatibility: ${{ steps.coverage.outputs.run_compatibility }}
      matrix: ${{ steps.coverage.outputs.matrix }}
      level: ${{ steps.coverage.outputs.level }}
    steps:
      - name: Choose emulator matrix from changed paths
        id: coverage
        uses: actions/github-script@v9
        with:
          script: |
            const fullMatrix = {
              include: [
                { android: '9', api_level: 28 },
                { android: '15', api_level: 35 },
                { android: '16', api_level: 36 }
              ]
            };

            if (context.eventName !== 'pull_request') {
              core.setOutput('run_compatibility', 'true');
              core.setOutput('level', 'full');
              core.setOutput('matrix', JSON.stringify(fullMatrix));
              core.notice('Push/manual run: full compatibility matrix selected.');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });
            const names = files.map(file => file.filename);

            const runtimeChanged = names.some(name =>
              name.startsWith('app/') ||
              name.startsWith('gradle/') ||
              name === 'gradle.properties' ||
              name === 'settings.gradle.kts' ||
              name === 'build.gradle.kts' ||
              name === 'gradlew' ||
              name === 'gradlew.bat' ||
              name === '.github/workflows/android-compatibility.yml'
            );

            if (!runtimeChanged) {
              core.setOutput('run_compatibility', 'false');
              core.setOutput('level', 'none');
              core.setOutput('matrix', JSON.stringify({ include: [] }));
              core.notice('No Android runtime/build changes: emulator compatibility skipped.');
              return;
            }

            const highRisk = [
              /^app\/src\/main\/java\/com\/azimulkabir\/actua\/data\/(sync|budget|security|network|rules|schedules)\//,
              /^app\/src\/main\/java\/com\/azimulkabir\/actua\/data\/ActuaRepository\.kt$/,
              /Migration/i,
              /Writer\.kt$/,
              /^\.github\/workflows\/android-compatibility\.yml$/
            ];
            const broadCoverage = [
              /^app\/src\/main\/java\/com\/azimulkabir\/actua\/data\//,
              /(^|\/)build\.gradle(?:\.kts)?$/,
              /(^|\/)settings\.gradle(?:\.kts)?$/,
              /^gradle\//,
              /^gradle\.properties$/,
              /^gradlew(?:\.bat)?$/
            ];

            let matrix;
            let level;
            if (names.some(name => highRisk.some(pattern => pattern.test(name)))) {
              level = 'full';
              matrix = fullMatrix;
            } else if (names.some(name => broadCoverage.some(pattern => pattern.test(name)))) {
              level = 'broad';
              matrix = {
                include: [
                  { android: '9', api_level: 28 },
                  { android: '15', api_level: 35 }
                ]
              };
            } else {
              level = 'standard';
              matrix = {
                include: [
                  { android: '15', api_level: 35 }
                ]
              };
            }

            core.setOutput('run_compatibility', 'true');
            core.setOutput('level', level);
            core.setOutput('matrix', JSON.stringify(matrix));
            core.notice(`Compatibility coverage selected: ${level} (${matrix.include.map(item => `API ${item.api_level}`).join(', ')}).`);

  emulator-compatibility:
    name: Android ${{ matrix.android }} / API ${{ matrix.api_level }}
    needs: select-coverage
    if: ${{ needs.select-coverage.outputs.run_compatibility == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-coverage.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-android-toolchain
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api_level }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api_level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run compatibility instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api_level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon --stacktrace connectedInstrumentedAndroidTest

      - name: Upload compatibility test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-compatibility-api-${{ matrix.api_level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7

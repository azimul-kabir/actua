name: Build Test APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build (leave blank to build the selected workflow branch)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: test-apk-${{ github.actor }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-apk:
    name: Build signed test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@v3

      - name: Install Android 17 compile SDK
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          export PATH="$HOME/.local/bin:$PATH"
          android --sdk="$ANDROID_SDK_ROOT" sdk install --canary platforms/android-37

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare persistent Actua signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ACTUA_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ACTUA_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ACTUA_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ACTUA_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/actua-test.jks"
          chmod 600 "$RUNNER_TEMP/actua-test.jks"

      - name: Build signed APK
        env:
          ACTUA_KEYSTORE_PATH: ${{ runner.temp }}/actua-test.jks
          ACTUA_KEYSTORE_PASSWORD: ${{ secrets.ACTUA_RELEASE_STORE_PASSWORD }}
          ACTUA_KEY_ALIAS: ${{ secrets.ACTUA_RELEASE_KEY_ALIAS }}
          ACTUA_KEY_PASSWORD: ${{ secrets.ACTUA_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK signature
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Name test artifact
        id: artifact
        shell: bash
        run: |
          TARGET_REF='${{ inputs.ref }}'
          if [ -z "$TARGET_REF" ]; then
            TARGET_REF="$GITHUB_REF_NAME"
          fi
          SAFE_REF="$(printf '%s' "$TARGET_REF" | tr '/:@ ' '----' | tr -cd '[:alnum:]._-')"
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          ARTIFACT="Actua-test-${SAFE_REF}-${SHORT_SHA}-run${GITHUB_RUN_NUMBER}"
          echo "name=$ARTIFACT" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "$ARTIFACT.apk"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.name }}.apk
          if-no-files-found: error
          retention-days: 7

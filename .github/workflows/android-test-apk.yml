name: Build Test APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build (leave blank to build the selected workflow branch)
        required: false
        type: string
      flavor:
        description: >-
          Which build to make: fdroid (no Play Billing, the public GitHub and F-Droid build) or
          playstore (the full build with Play Billing and the supporter extras)
        required: false
        default: fdroid
        type: choice
        options:
          - fdroid
          - playstore

permissions:
  contents: read

concurrency:
  group: test-apk-${{ github.actor }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-apk:
    name: Build signed test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-android-toolchain

      - name: Prepare isolated test app identity
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          gradle = Path("app/build.gradle.kts")
          text = gradle.read_text(encoding="utf-8")
          old = 'applicationId = "com.azimulkabir.actua"'
          new = 'applicationId = "com.azimulkabir.actua.test"'
          if old not in text:
              raise SystemExit("Expected production applicationId was not found")
          text = text.replace(old, new, 1)
          gradle.write_text(text, encoding="utf-8")

          strings = Path("app/src/main/res/values/strings.xml")
          text = strings.read_text(encoding="utf-8")
          # Match on the name only: the line carries other attributes (translatable="false").
          app_name = re.compile(r'(<string name="app_name"[^>]*>)Actua(</string>)')
          if not app_name.search(text):
              raise SystemExit("Expected production app_name was not found")
          text = app_name.sub(r'\1Actua Test\2', text, count=1)
          text = text.replace("Open Actua to", "Open Actua Test to")
          strings.write_text(text, encoding="utf-8")

          # Build the release build type (R8, not debuggable, with the baseline profile) so Actua Test performs like
          # the published app; a debug build is several times slower. Gradle signs it with the throwaway debug key,
          # since no signing secrets are available here, and it is re-signed with the persistent key below.
          old = 'signingConfig = signingConfigs.getByName("release")'
          new = 'signingConfig = signingConfigs.getByName("debug")'
          text = gradle.read_text(encoding="utf-8")
          if text.count(old) != 1:
              raise SystemExit("Expected the release build type's signing config was not found")
          gradle.write_text(text.replace(old, new), encoding="utf-8")

          shortcuts = Path("app/src/main/res/xml/shortcuts.xml")
          if shortcuts.exists():
              text = shortcuts.read_text(encoding="utf-8")
              old = 'android:targetPackage="com.azimulkabir.actua"'
              new = 'android:targetPackage="com.azimulkabir.actua.test"'
              if old not in text:
                  raise SystemExit("Expected production launcher shortcut targetPackage was not found")
              text = text.replace(old, new)
              shortcuts.write_text(text, encoding="utf-8")
          PY

      - name: Select build flavor
        id: flavor
        env:
          FLAVOR: ${{ inputs.flavor }}
        run: |
          # "fdroid" (the default) matches the public GitHub/F-Droid APK; "playstore" is the full build
          # with Play Billing. Anything else is refused rather than guessed at.
          case "${FLAVOR:-fdroid}" in
            fdroid)
              echo "task=assembleFdroidRelease" >> "$GITHUB_OUTPUT"
              echo "dir=fdroid" >> "$GITHUB_OUTPUT"
              echo "label=" >> "$GITHUB_OUTPUT"
              ;;
            playstore)
              echo "task=assemblePlaystoreRelease" >> "$GITHUB_OUTPUT"
              echo "dir=playstore" >> "$GITHUB_OUTPUT"
              echo "label=Play-" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown flavor: ${FLAVOR}" >&2
              exit 1
              ;;
          esac

      - name: Build test APK without signing secrets
        run: ./gradlew --no-daemon --stacktrace ${{ steps.flavor.outputs.task }}

      - name: Prepare persistent Actua signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ACTUA_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ACTUA_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ACTUA_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ACTUA_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/actua-test.jks"
          chmod 600 "$RUNNER_TEMP/actua-test.jks"

      - name: Name test artifact
        id: artifact
        shell: bash
        env:
          FLAVOR_DIR: ${{ steps.flavor.outputs.dir }}
          LABEL: ${{ steps.flavor.outputs.label }}
        run: |
          TARGET_REF='${{ inputs.ref }}'
          if [ -z "$TARGET_REF" ]; then
            TARGET_REF="$GITHUB_REF_NAME"
          fi
          SAFE_REF="$(printf '%s' "$TARGET_REF" | tr '/:@ ' '----' | tr -cd '[:alnum:]._-')"
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          # The F-Droid name is unchanged; the Play build is "Actua-Test-Play-...".
          ARTIFACT="Actua-Test-${LABEL}${SAFE_REF}-${SHORT_SHA}-run${GITHUB_RUN_NUMBER}"
          echo "name=$ARTIFACT" >> "$GITHUB_OUTPUT"
          cp "app/build/outputs/apk/${FLAVOR_DIR}/release/app-${FLAVOR_DIR}-release.apk" "$RUNNER_TEMP/$ARTIFACT.apk"
          # R8 renames classes in the release build; this file turns a tester's crash stack trace back into source names.
          cp "app/build/outputs/mapping/${FLAVOR_DIR}Release/mapping.txt" "$ARTIFACT-mapping.txt"

      - name: Re-sign test APK with persistent Actua key
        env:
          STORE_PASSWORD: ${{ secrets.ACTUA_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ACTUA_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ACTUA_RELEASE_KEY_PASSWORD }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/actua-test.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$ARTIFACT_NAME.apk" \
            "$RUNNER_TEMP/$ARTIFACT_NAME.apk"
          "$APKSIGNER" verify --verbose --print-certs "$ARTIFACT_NAME.apk"

      - name: Remove signing material
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/actua-test.jks"

      - name: Upload test APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            ${{ steps.artifact.outputs.name }}.apk
            ${{ steps.artifact.outputs.name }}-mapping.txt
          if-no-files-found: error
          retention-days: 7

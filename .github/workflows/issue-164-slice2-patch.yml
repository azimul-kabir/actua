name: Apply Issue 164 Slice 2 UI patch

on:
  push:
    branches:
      - issue-164-balance-cap-slice-2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-164-balance-cap-slice-2
      - name: Apply Balance Cap editor patch
        run: python3 .github/scripts/issue164_slice2.py
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/azimulkabir/actua/ui/budget/BudgetScreen.kt
          git commit -m "Apply Balance Cap Slice 2 UI"
          git push

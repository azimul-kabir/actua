version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: "Asia/Dhaka"
    open-pull-requests-limit: 5
    groups:
      android-platform:
        patterns:
          - "androidx.core:*"
          - "androidx.lifecycle:*"
          - "androidx.activity:*"
          - "androidx.test:*"
          - "androidx.work:*"
          - "com.android.tools.build:gradle"
      kotlin-compose:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx:*"
          - "androidx.compose.*"
    labels:
      - dependencies
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: "Asia/Dhaka"
    open-pull-requests-limit: 5
    groups:
      android-toolchain:
        patterns:
          - "actions/checkout"
          - "actions/setup-java"
          - "android-actions/setup-android"
          - "gradle/actions/setup-gradle"
          - "reactivecircus/android-emulator-runner"
      ci-support:
        patterns:
          - "actions/upload-artifact"
          - "actions/github-script"
          - "actions/setup-python"
    labels:
      - dependencies
    commit-message:
      prefix: ci
